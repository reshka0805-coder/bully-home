<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bully Home — бультерьер на двоих</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* ===== стиль: лужайка + неоновые «клавиши» ===== */
:root{
  --ink:#e8ecf4;--ink2:#8b93ab;--bg:#0f1320;--card:#161b2a;--line:#2a3350;
  --key:#232a40;--key2:#1a2033;--keyd:#090c15;--wht:#e8ecf4;
  --cyan:#35f2ff;--mag:#ff4fd8;--lime:#9dff4f;--amber:#ffd23f;--red:#ff3b5c;
  --pink:#35f2ff;--pink2:#1d3a48;--mint:#9dff4f;--mint2:#1f3a26;--sun:#ffd23f;--sky:#35f2ff;--lav:#b28cff;
  --px:'PT Sans',Tahoma,Verdana,sans-serif;--px2:'PT Mono',Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--px);color:var(--ink);font-size:15px;background:radial-gradient(120% 70% at 50% 0%,#1b2340 0%,#0f1320 60%)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;color:var(--ink)}
#app{height:100dvh;max-width:540px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
/* иконки */
.ico{width:1.2em;height:1.2em;display:inline-block;vertical-align:-0.22em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;color:var(--ic,currentColor);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--ic,transparent) 55%,transparent))}
.ico.tf>*:not(.f){fill:var(--ic);fill-opacity:.22}
.bar .ico{color:currentColor;filter:none}
.act:disabled .ico{filter:grayscale(.6)}
.ico .f{fill:currentColor;stroke:none}
.kc{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border:2px solid var(--wht);border-radius:8px;background:var(--key);box-shadow:0 3px 0 var(--keyd)}
.kc .ico{width:1.25em;height:1.25em;vertical-align:0}
img.pe{display:inline-block;vertical-align:-0.2em;width:1.25em;height:1.25em}

/* верх */
#top{display:flex;align-items:center;gap:6px;padding:10px 12px 8px}
.pill{background:var(--key2);border:2px solid var(--line);border-radius:99px;padding:4px 11px 4px 8px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--keyd)}
.pill i{font-style:normal;display:flex}
#coins{font-family:var(--px2);font-size:16px;font-weight:700;color:var(--amber);text-shadow:0 0 8px rgba(255,210,63,.5)}
#top .sp{flex:1}
#pairPill{font-size:14px}
#giftBtn{display:none;border-color:var(--mag);color:var(--mag);box-shadow:0 3px 0 var(--keyd),0 0 10px rgba(255,79,216,.5);animation:gpulse 1.6s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 3px 0 var(--keyd),0 0 18px rgba(255,79,216,.8)}}
@keyframes bounce{50%{transform:translateY(-4px)}}

/* лужайка */
#room{position:relative;margin:0 10px;border-radius:16px;overflow:hidden;flex:1 1 auto;min-height:280px;max-height:620px;touch-action:none;border:2px solid var(--line);box-shadow:0 4px 0 var(--keyd),0 10px 30px rgba(0,0,0,.45)}
#sky{position:absolute;inset:0 0 50% 0;transition:background 2s}
#sun{position:absolute;width:34px;height:34px;border-radius:50%;right:16%;top:16%}
#stars{position:absolute;inset:0}
#stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.cloud{position:absolute;height:14px;border-radius:14px;background:rgba(255,255,255,.85);filter:blur(.3px);animation:cloud 60s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:22px;height:22px;left:10px;top:-10px}.cloud:after{width:16px;height:16px;left:28px;top:-6px}
.cloud.c1{width:56px;top:18%;left:-20%}.cloud.c2{width:44px;top:32%;left:-30%;animation-duration:85s;animation-delay:-30s;opacity:.8}
@keyframes cloud{to{transform:translateX(560px)}}
#hills{position:absolute;left:0;right:0;top:28%;height:22%;width:100%}
#fence{position:absolute;left:0;right:0;top:38%;height:12%;
  background:linear-gradient(transparent 22%,#e9dcc0 22% 30%,transparent 30% 62%,#e9dcc0 62% 70%,transparent 70%),
             repeating-linear-gradient(90deg,transparent 0 6px,#f3e8cf 6px 14px,#c9b894 14px 16px,transparent 16px 26px);
  -webkit-mask:linear-gradient(#000,#000);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
#grass,#grassF{position:absolute;left:0;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#grass{top:44%;height:56%}
#grassF{bottom:0;height:16%;z-index:960}
#door{position:absolute;left:22%;top:30%;width:15%;height:21%;cursor:pointer;z-index:4;
  background:repeating-linear-gradient(90deg,#b88a55 0 7px,#8e6438 7px 9px);border:2px solid #4a3218;border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 3px #a87a48}
#door:before{content:"";position:absolute;left:8%;right:8%;top:48%;height:3px;background:#5d3e1d;transform:rotate(-24deg)}
#door .sign{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--key);color:var(--wht);border:2px solid var(--wht);border-radius:6px;padding:0 6px;white-space:nowrap;box-shadow:0 2px 0 var(--keyd)}
#board{position:absolute;right:7%;top:27%;width:13%;height:24%;cursor:pointer;z-index:4}
#board .post{position:absolute;left:44%;width:12%;top:40%;bottom:0;background:#7a5430;border:2px solid #3e2a16;border-bottom:0}
#board .box{position:absolute;left:0;right:0;top:0;height:44%;background:#3d6fd8;border:2px solid #152a5a;border-radius:12px 12px 4px 4px;box-shadow:inset 0 3px 0 #6a95f0}
#board .flag{position:absolute;right:-6px;top:6%;width:5px;height:42%;background:#ff3b5c;border:1px solid #5a0a1a;transform-origin:bottom;transition:transform .4s}
#board .flag:after{content:"";position:absolute;left:4px;top:0;width:8px;height:7px;background:#ff3b5c;border:1px solid #5a0a1a}
#board.down .flag{transform:rotate(90deg)}
#board .cap{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--wht);background:var(--key);border:2px solid var(--wht);border-radius:6px;padding:0 5px;white-space:nowrap}
#board .cnt{position:absolute;left:30%;top:10%;font-size:11px;font-weight:700;color:#fff}
#board .n{display:none}
.furn{position:absolute;transform:translate(-50%,-100%);cursor:default}
.furn svg,.furn img{width:100%;height:auto;display:block;overflow:visible;pointer-events:none;-webkit-user-drag:none;user-select:none}
.edit .dogw,.edit .rdoor,.edit #homeDoor,.edit #board{pointer-events:none}
.edit .furn.drag{opacity:.85;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.furn img,.it .ic img.fi{image-rendering:pixelated;image-rendering:crisp-edges}
.furn:after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:12%;border-radius:50%;background:rgba(10,30,10,.35);z-index:-1}
.edit .furn{cursor:grab;outline:2px dashed rgba(255,255,255,.6);outline-offset:3px;border-radius:6px}
.edit .furn.sel{outline:2px solid var(--cyan);box-shadow:0 0 12px rgba(53,242,255,.6)}
.dogw{position:absolute;cursor:pointer}
.pdog{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.pimg{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;height:auto}
.dogw .tag{position:absolute;left:50%;top:17%;transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(15,19,32,.85);color:var(--wht);border:2px solid var(--wht);border-radius:99px;padding:0 7px;white-space:nowrap;pointer-events:none;line-height:1.3}
.dogw.sel .tag{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(53,242,255,.6)}
.dogw .bub{position:absolute;left:62%;top:21%;font-size:18px;animation:bounce 1.2s infinite;pointer-events:none}
.fx{position:absolute;pointer-events:none;font-size:20px;z-index:999;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx,0),-70px) scale(1.2);opacity:0}}
#editBtn{position:absolute;right:8px;top:8px;z-index:1000;background:var(--key);color:var(--wht);border:2px solid var(--wht);border-radius:10px;box-shadow:0 3px 0 var(--keyd);padding:6px 11px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
#editBar{position:absolute;left:8px;right:8px;bottom:8px;z-index:1000;display:none;gap:6px;justify-content:center}
.edit #editBar{display:flex}
#atmo{position:absolute;inset:0;pointer-events:none;z-index:950;transition:background 2s}
#atmo.night{background:linear-gradient(rgba(8,10,40,.25),rgba(8,10,40,.45))}
#atmo.eve{background:linear-gradient(rgba(255,120,60,.08),rgba(80,20,60,.18))}

/* панель */
#panel{margin:10px 10px 0;padding:10px 12px;background:rgba(22,27,42,.95);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--keyd)}
#panel .hd{display:flex;align-items:center;gap:8px}
#panel .nm{font-size:20px;font-weight:700}
#panel .lv{font-size:13px;color:var(--ink2)}
#panel .mood{margin-left:auto;font-size:20px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin:10px 0}
.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar>span{display:flex;color:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.bar .tr{flex:1;height:14px;border-radius:99px;background:#070a12;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);overflow:hidden;position:relative;padding:2px}
.bar .fl{height:100%;border-radius:99px;transition:width .5s;position:relative;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),var(--c))!important;
  box-shadow:0 0 6px var(--c),0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.bar .fl:before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.45) 7px 9px)}
.bar .fl:after{content:"";position:absolute;left:0;right:0;top:1px;height:35%;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:shine 2.8s linear infinite}
@keyframes shine{from{background-position:-60% 0}to{background-position:160% 0}}
.bar.low .fl{animation:lowp 1s ease-in-out infinite}
@keyframes lowp{50%{filter:brightness(1.6)}}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.act{background:var(--key);border:2px solid var(--wht);border-radius:12px;box-shadow:0 4px 0 var(--keyd);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700}
.act b{font-size:25px;line-height:1;display:flex}
.act:active,.btn:active,#nav button:active,.pill:active,.kc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--keyd)}
.act:disabled{opacity:.35}

/* навигация */
#nav{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:6px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;padding:6px 0 4px;position:relative;background:var(--key2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--keyd);color:var(--ink2)}
#nav button b{font-size:24px;line-height:1;display:flex}
#nav button.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 3px 0 var(--keyd),0 0 10px rgba(53,242,255,.45),inset 0 0 10px rgba(53,242,255,.15)}
#nav .dot{position:absolute;top:-4px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--mag);border:2px solid var(--bg);box-shadow:0 0 8px var(--mag);display:none}

/* лист */
#sheetBg{position:absolute;inset:0;background:rgba(5,7,14,.65);z-index:2000;display:none}
#sheet{position:absolute;left:6px;right:6px;bottom:0;max-height:86%;z-index:2001;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;background:#141929;border:2px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(53,242,255,.35)}
#sheet.open{transform:none}
#sheet .sh{display:flex;align-items:center;padding:12px 14px 8px;font-size:20px;font-weight:700}
#sheet .sh button{margin-left:auto;width:34px;height:34px;font-size:18px;background:var(--key);border:2px solid var(--wht);border-radius:9px;box-shadow:0 3px 0 var(--keyd)}
#sheet .sb{overflow-y:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--key2);border:2px solid var(--line);border-radius:10px;box-shadow:0 3px 0 var(--keyd);color:var(--ink2)}
.tabs button.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 3px 0 var(--keyd),0 0 8px rgba(53,242,255,.4)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--key2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--keyd);padding:8px 6px;text-align:center;font-size:13px;font-weight:700;position:relative}
.it .ic{height:58px;display:flex;align-items:center;justify-content:center;font-size:34px}
.it .ic svg,.it .ic img.fi{max-height:58px;max-width:80px}
.it .ic img.pe{width:40px;height:40px}
.it .pr{margin-top:4px;font-size:14px;color:var(--amber)}
.it .cnt{position:absolute;top:4px;right:5px;font-size:11px;background:var(--cyan);color:#05202a;border-radius:6px;padding:0 5px}
.btn{background:var(--key);color:var(--cyan);padding:10px 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--cyan);border-radius:12px;box-shadow:0 4px 0 var(--keyd),0 0 10px rgba(53,242,255,.35),inset 0 0 10px rgba(53,242,255,.12)}
.btn.m{color:var(--lime);border-color:var(--lime);box-shadow:0 4px 0 var(--keyd),0 0 10px rgba(157,255,79,.35),inset 0 0 10px rgba(157,255,79,.12)}
.btn.w{color:var(--wht);border-color:var(--wht);box-shadow:0 4px 0 var(--keyd)}
.btn.s{padding:5px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.35}
.wide{width:100%}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card b{font-size:16px}
.muted{color:var(--ink2);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.route{display:flex;align-items:center;gap:12px}
.route .em{font-size:30px;display:flex}
.route .em img.pe{width:40px;height:40px}
.route .t{flex:1}
.found{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.found .f{aspect-ratio:1;background:var(--key2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--keyd);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink2);font-family:var(--px2);font-size:20px;font-weight:700}
.found .f img.pe{width:34px;height:34px}
.found .f.r1{border-color:var(--cyan);box-shadow:0 3px 0 var(--keyd),0 0 8px rgba(53,242,255,.35)}
.found .f.r2{border-color:var(--amber);box-shadow:0 3px 0 var(--keyd),0 0 10px rgba(255,210,63,.45)}
.found .f.no{opacity:.5}
.found .f small{position:absolute;bottom:1px;right:4px;font-size:11px;color:var(--ink2)}
.feed{max-height:240px;overflow-y:auto}
.feed div{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.feed time{color:var(--ink2);margin-right:6px;font-family:var(--px2);font-size:12px}
.feed div b{color:var(--cyan)}
.note{background:var(--key2);border:2px solid var(--line);border-left:4px solid var(--mag);border-radius:10px;padding:7px 9px;margin-top:6px;font-size:15px}
.note .muted{font-size:12px}
input.tx,textarea.tx{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;background:#0a0d18;outline:none;user-select:text;-webkit-user-select:text;caret-color:var(--cyan)}
input.tx:focus,textarea.tx:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(53,242,255,.4)}

/* тост и диалог */
#toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-14px);background:#141929;color:var(--wht);border:2px solid var(--cyan);border-radius:12px;box-shadow:0 0 14px rgba(53,242,255,.45);padding:8px 14px;font-size:15px;font-weight:700;z-index:5000;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;z-index:4000;background:rgba(5,7,14,.75);display:none;align-items:center;justify-content:center;padding:20px}
#modal .mb{background:#141929;border:2px solid var(--cyan);border-radius:18px;box-shadow:0 0 24px rgba(53,242,255,.35),0 6px 0 var(--keyd);padding:18px 16px;width:100%;max-width:380px;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.88);opacity:0}}
#modal .big{font-size:56px;line-height:1.1}
#modal .big img.pe{width:72px;height:72px}
#modal h3{margin:8px 0 4px;font-size:22px}
#modal p{font-size:15px;line-height:1.35}

/* выбор щенка */
#ob{position:absolute;inset:0;z-index:3000;display:none;flex-direction:column;align-items:center;padding:24px 18px;overflow-y:auto;background:var(--bg)}
#ob h1{font-size:25px;margin:6px 0 2px;text-align:center;line-height:1.15}
.coats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:12px 0}
.coat{background:var(--key2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--keyd);padding:6px;font-size:14px;font-weight:700;text-align:center}
.coat.on{border-color:var(--cyan);box-shadow:0 3px 0 var(--keyd),0 0 10px rgba(53,242,255,.45)}
.cols{display:flex;gap:9px;margin:8px 0 14px;flex-wrap:wrap;justify-content:center}
.col{width:32px;height:32px;border-radius:9px;border:2px solid var(--wht);box-shadow:0 3px 0 var(--keyd)}
.col.on{box-shadow:0 3px 0 var(--keyd),0 0 0 3px var(--cyan)}

/* мини-игры */
#game{position:absolute;inset:0;z-index:3500;display:none;flex-direction:column;background:var(--bg)}
#game .gh{display:flex;align-items:center;padding:10px 12px;font-weight:700;font-size:16px;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
#game .gh button{margin-left:auto}
#gcv{flex:1 1 0;min-height:0;width:100%;touch-action:none;display:block;image-rendering:pixelated}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px;flex:1;align-content:center}
.mc{aspect-ratio:1;background:var(--key);border:2px solid var(--wht);border-radius:12px;box-shadow:0 4px 0 var(--keyd);display:flex;align-items:center;justify-content:center;font-size:30px;color:transparent;position:relative}
.mc:before{content:"?";position:absolute;color:var(--wht);font-family:var(--px2);font-size:24px;font-weight:700}
.mc span{display:none}.mc.op span,.mc.ok span{display:inline}
.mc.op,.mc.ok{color:inherit}
.mc.op:before,.mc.ok:before{display:none}
.mc.op{border-color:var(--cyan);box-shadow:0 4px 0 var(--keyd),0 0 10px rgba(53,242,255,.45)}
.mc.ok{border-color:var(--lime);box-shadow:0 4px 0 var(--keyd),0 0 10px rgba(157,255,79,.45);opacity:.85}
.mc img.pe{width:36px;height:36px}
.fetch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.stage{width:100%;height:200px;display:block;image-rendering:pixelated;border:2px solid var(--line);border-radius:14px}
#game>.stage{height:130px;border-width:0 0 2px;border-radius:0}
#fst{height:230px}
.pw{width:90%;height:22px;background:#070a12;position:relative;overflow:hidden;border:2px solid var(--line);border-radius:99px}
.pw .z{position:absolute;top:0;bottom:0;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.pw .z2{position:absolute;top:0;bottom:0;background:rgba(255,210,63,.55)}

<script>
/* DogSprite v2 — детальный изометрический бультерьер.
   Пёс собран из 3D-поверхностей (эллипсоиды, «яйцо», капсулы), рендерится с
   двойным сглаживанием, мягким светом, контуром и деталями морды.
   Кадр 192×192, 8 направлений, анимации: idle, walk, eat, drink, sit, sleep, happy, shake. */
function DogSpriteFactory() {
  const W = 80, H = 86, OX = 40, OY = 59, K = 2.5;   // выходной кадр
  const SS = 1;                                          // суперсэмплинг
  const IW = W * SS, IH = H * SS, IK = K * SS;
  const STEP = 0.55 / IK;                                // шаг по поверхности (в юнитах)
  const DIRS = 8;
  const ANIMS = {
    idle:  {n: 8, fps: 6},
    walk:  {n: 12, fps: 16},
    eat:   {n: 8, fps: 9},
    drink: {n: 8, fps: 12},
    sit:   {n: 6, fps: 4},
    sleep: {n: 6, fps: 3},
    happy: {n: 10, fps: 14},
    shake: {n: 10, fps: 16},
  };
  const camR = [0.7071, -0.7071, 0], camU = [-0.3536, -0.3536, 0.8660], camV = [0.6124, 0.6124, 0.5];
  const L = norm([-0.5, 0.25, 1.0]);           // основной свет (сверху-слева)
  const L2 = norm([0.8, 0.6, 0.2]);            // контровой
  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function mm(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]; return r; }
  function mv(m, v) { return [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]]; }
  const I = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const rY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const rZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  /* ---------- цвета ---------- */
  function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function ramp(h, warm = [255, 247, 232]) { const c = hex(h); return {sh: mix(c, [34, 28, 72], 0.45), md: c, hi: mix(c, warm, 0.36)}; }
  const COATS = {
    white:   {base: '#eeeaf0', chest: '#f8f5f6', patch: null,      stripe: null,      ear: '#ee9fb4', blaze: false, muzzle: '#f2dde4'},
    patch:   {base: '#eeeaf0', chest: '#f8f5f6', patch: '#2e2630', stripe: null,      ear: '#ee9fb4', blaze: false, muzzle: '#f2dde4'},
    brindle: {base: '#8f6446', chest: '#eeeaf0', patch: null,      stripe: '#4a2f22', ear: '#c98a7c', blaze: true},
    red:     {base: '#d0834a', chest: '#f5ede6', patch: null,      stripe: null,      ear: '#e59f8c', blaze: true},
    black:   {base: '#2e2a36', chest: '#eeeaf0', patch: null,      stripe: null,      ear: '#7a6070', blaze: true},
    lav:     {base: '#b39ce8', chest: '#f1ebff', patch: '#8a6fd0', stripe: null,      ear: '#f0aed0', blaze: false, muzzle: '#e4d8f8'},
  };
  function palette(coat, collar) {
    const C = COATS[coat] || COATS.white;
    return {
      base: ramp(C.base), chest: ramp(C.chest), patch: ramp(C.patch || C.base), stripe: ramp(C.stripe || C.base),
      earIn: ramp(C.ear), muzzle: ramp(C.muzzle || C.chest), cheek: ramp('#f0a0b4'),
      nose: {sh: [24, 16, 20], md: [46, 34, 40], hi: [120, 104, 112]},
      eye: {sh: [16, 10, 14], md: [28, 18, 24], hi: [70, 52, 60]}, shine: {sh: [255, 255, 255], md: [255, 255, 255], hi: [255, 255, 255]},
      lid: ramp(C.patch && coat !== 'lav' ? '#2a2020' : '#3b2a2c'), mouth: {sh: [70, 40, 48], md: [96, 56, 64], hi: [120, 74, 82]},
      collar: ramp(collar || '#f2b84b'), tag: ramp('#f2c14e', [255, 250, 220]), tongue: ramp('#ec6f8d'), pad: ramp('#4a3a48'),
    };
  }

  /* ---------- поза ---------- */
  function pose(anim, f, n) {
    const t = f / n, TAU = Math.PI * 2, s = Math.sin(t * TAU), c = Math.cos(t * TAU);
    const P = {bodyZ: 8.3, bodyPitch: 0, bodyRoll: 0, lift: 0, neckPitch: -0.9, neckDX: 0, neckDZ: 0, headPitch: 0.32, headYaw: 0, headRoll: 0, headDZ: 0, headDX: 0,
      tailWag: 0, tailUp: 0.18, eyes: 'open', tongue: false, mode: 'stand', earBack: 0, sw: [0, 0, 0, 0], legLift: null, mouth: 0};
    if (anim === 'idle') { P.bodyZ += s * 0.08; P.tailWag = s * 0.28; P.headYaw = Math.sin(t * TAU) * 0.08; if (t >= 0.44 && t < 0.56) P.eyes = 'closed'; P.earBack = Math.max(0, Math.sin(t * TAU)) * 0.12; }
    if (anim === 'walk') {
      const a = 0.42; P.sw = [s * a, -s * a, -s * a, s * a];
      P.legLift = [Math.max(0, c), Math.max(0, -c), Math.max(0, -c), Math.max(0, c)];
      P.bodyZ += Math.abs(s) * 0.3 - 0.1; P.tailWag = s * 0.3; P.headPitch = 0.36 + Math.cos(t * TAU * 2) * 0.03; P.bodyRoll = s * 0.025;
    }
    if (anim === 'eat' || anim === 'drink') {
      const chew = (Math.sin(t * TAU * 2) + 1) / 2; P.neckPitch = 0.75; P.neckDX = 1.1; P.neckDZ = -2.6; P.headPitch = 1.15; P.headDX = 2.4; P.headDZ = -9.6 + (anim === 'eat' ? chew * 0.4 : chew * 0.12);
      P.bodyPitch = 0.1; P.tailWag = s * 0.4; P.eyes = anim === 'eat' && chew > 0.6 ? 'closed' : 'open'; P.tongue = anim === 'drink' && Math.sin(t * TAU * 2) > 0; P.frontBend = 0.25;
    }
    if (anim === 'sit') { P.mode = 'sit'; P.tailWag = s * 0.2; if (t >= 0.5 && t < 0.67) P.eyes = 'closed'; P.headYaw = Math.sin(t * TAU) * 0.13; }
    if (anim === 'sleep') { P.mode = 'lie'; P.eyes = 'closed'; P.breath = s * 0.12; P.earBack = 0.35; }
    if (anim === 'happy') {
      P.lift = Math.max(0, s) * 2.6; P.tailWag = Math.sin(t * TAU * 3) * 0.65; P.eyes = 'happy'; P.tongue = true; P.mouth = 1; P.headPitch = 0.1;
      P.sw = [-0.75 * Math.max(0, s), -0.75 * Math.max(0, s), 0.35 * Math.max(0, s), 0.35 * Math.max(0, s)];
    }
    if (anim === 'shake') { const w = Math.sin(t * TAU * 2); P.bodyRoll = w * 0.28; P.headRoll = -w * 0.5; P.eyes = 'closed'; P.tailWag = -w * 0.6; P.earBack = 0.45; }
    return P;
  }

  /* ---------- детали ---------- */
  function buildParts(P) {
    const parts = [];
    const lie = P.mode === 'lie', sit = P.mode === 'sit';
    let bc = [0, 0, P.bodyZ + P.lift], bR = mm(rY(P.bodyPitch), rX(P.bodyRoll));
    if (sit) { bc = [-1.8, 0, 7.0]; bR = rY(-0.62); }
    if (lie) { bc = [0, 0, 2.95 + (P.breath || 0)]; bR = I; }
    const BF = {c: bc, R: bR};
    const B = p => add(bc, mv(bR, p));
    const body = (id, c, r, R = I, k = 'ell') => parts.push({k, F: BF, c, R, r, col: 'body', id});
    // корпус: глубокая грудь, подтянутый живот, круп
    body(1, [2.5, 0, -0.05], [3.95, 2.72, 3.35]);
    body(1, [-0.6, 0, 0.5], [4.3, 2.4, 2.55]);
    body(1, [-3.7, 0, 0.45], [3.35, 2.55, 2.75]);
    for (const sg of [1, -1]) {
      body(13, [3.0, sg * 1.85, -0.5], [1.95, 0.98, 2.6], rY(0.25));
      body(14, [-4.0, sg * 1.85, -0.3], [2.35, 1.08, 2.75], rY(-0.2));
    }
    // голова — длинное «яйцо» с опущенным носом
    let hc = B([7.6 + P.headDX, 0, 5.5 + P.headDZ]);
    if (sit) hc = B([7.6, 0, 5.2]);
    if (lie) hc = [8.6, 0, 3.0];
    const hR = mm(mm(mm(bR, rZ(P.headYaw)), rX(P.headRoll)), rY(P.headPitch + (sit ? 0.55 : 0) + (lie ? 0.1 : 0)));
    const HF = {c: hc, R: hR};
    // шея — ровная сужающаяся «труба» от плеч к основанию черепа, без горбов
    const nb = B([4.1 + P.neckDX * 0.3, 0, 1.2 + P.neckDZ * 0.3]);
    const nt = add(hc, mv(hR, [-2.0, 0, -0.75]));
    parts.push({k: 'cap', a: nb, b: nt, r0: 1.5, r1: 1.15, col: 'neck', id: 2});
    // ошейник — кольцо поперёк шеи
    const nd = norm(sub(nt, nb)), nlen = Math.hypot(...sub(nt, nb));
    const tmp = Math.abs(nd[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    const e1 = norm([nd[1] * tmp[2] - nd[2] * tmp[1], nd[2] * tmp[0] - nd[0] * tmp[2], nd[0] * tmp[1] - nd[1] * tmp[0]]);
    const e2 = [nd[1] * e1[2] - nd[2] * e1[1], nd[2] * e1[0] - nd[0] * e1[2], nd[0] * e1[1] - nd[1] * e1[0]];
    const rc = add(nb, nd.map(v => v * nlen * 0.55)), rr = 1.5 + (1.15 - 1.5) * 0.55 + 0.1;
    const ring = [];
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; ring.push(add(rc, add(e1.map(v => v * Math.cos(a) * rr), e2.map(v => v * Math.sin(a) * rr)))); }
    for (let i = 0; i < 16; i++) parts.push({k: 'cap', a: ring[i], b: ring[(i + 1) % 16], r0: 0.34, r1: 0.34, col: 'collar', id: 15});
    const low = ring.reduce((m, p) => p[2] < m[2] ? p : m, ring[0]);

function dogNew(name, coat, collar){
  const t = now();
  return {id:uid(), name, coat, collar, born:t, xp:0, st:{food:80,fun:80,clean:90,energy:85}, t, sleep:false, walk:null, owner:me.id};
}
function cur(d){ // текущие показатели с учётом времени
  const h = (now() - d.t)/3600000, o = {};
  for (const k in RATE){
    let r = RATE[k];
    if (d.walk) { r = k==='energy'? 2 : r*0.4; }
    else if (d.sleep) { r = k==='energy' ? -22 : r*0.45; }
    o[k] = clamp(d.st[k] - r*h);
  }
  return o;
}
function norm(d){ d.st = cur(d); d.t = now(); }
function mood(d){ const c=cur(d); const m=(c.food+c.fun+c.clean+c.energy)/4; return m>70?'😍':m>50?'🙂':m>30?'😕':'😢'; }
function level(d){ return 1 + Math.floor(Math.sqrt(d.xp/20)); }
function addXP(d, n){ const l=level(d); d.xp+=n; if(level(d)>l){ S.coins+=25*level(d); later(()=>{ toast(`🎉 ${d.name}: уровень дружбы ${level(d)}! +${25*level(d)} 🪙`); sfx.win(); }); } }
function logIt(txt){ S.log.unshift({t:now(), who:me.name, txt}); S.log.length = Math.min(S.log.length, 60); }
let laterQ=[]; function later(f){ laterQ.push(f); }

/* ================= sync ================= */
async function api(path, body){
  const h = {'Content-Type':'application/json','X-Init-Data': (tg && tg.initData) || ''};
  if (DEV_USER) h['X-Dev-User'] = encodeURIComponent(DEV_USER);
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 8000);
  try {
    const r = await fetch('api'+path, {method: body!==undefined?'POST':'GET', headers:h, body: body!==undefined?JSON.stringify(body):undefined, signal:ctl.signal});
    const j = await r.json().catch(()=>({}));
    j._status = r.status; return j;
  } finally { clearTimeout(to); }

    a.el = e; a.cv = e.querySelector('canvas'); a.ctx = a.cv.getContext('2d'); a.drawn = null;
    placeDog(d.id); drawDog(d, a, performance.now());
    L.appendChild(e);
  });
}
function placeDog(id){ const a=anim[id]; if(!a||!a.el) return; a.el.style.left=a.x+'%'; a.el.style.top=a.y+'%'; a.el.style.zIndex = a.zo!=null ? a.zo : 10+Math.round(a.y*2)+1; }
const warmed=new Set(); function warmDog(d){ const k=d.coat+'|'+d.collar; if(warmed.has(k)) return; warmed.add(k); DogSprite.prewarm(d.coat, d.collar||'#ff6b6b'); }
function drawDog(d, a, t){
  if (!a.ctx) return;
  const fr = DogSprite.frame(d.coat, d.collar||'#ff6b6b', a.act, a.dir, (t - a.t0)/1000, true);
  if (a.drawn === fr) return;
  a.ctx.clearRect(0,0,DogSprite.W,DogSprite.H); a.ctx.drawImage(fr,0,0); a.drawn = fr;
}
function setAct(a, act, dur){ if (a.act!==act){ a.act=act; a.t0=performance.now(); if (act==='walk'||act==='idle') a.zo=null; } a.until = dur ? performance.now()+dur*1000 : 0; }
// отправить собаку к точке и затем сделать действие
function goDo(id, x, y, act, dur, face, onArrive, zo){
  const a = anim[id]; if (!a) return;
  a.tx = clamp(x,4,96); a.ty = clamp(y,62,99); a.then = {act, dur, face, onArrive, zo};
}
// где на экране предмет (в % комнаты)
function furnBox(f){ const el=document.querySelector(`.furn[data-id="${f.id}"]`); if(!el) return null; const R=$('#room').getBoundingClientRect(), r=el.getBoundingClientRect();
  return {cx:(r.left+r.width/2-R.left)/R.width*100, cy:(r.top+r.height/2-R.top)/R.height*100, top:(r.top-R.top)/R.height*100, h:r.height/R.height*100, z:+el.style.zIndex||10}; }
// поставить пса так, чтобы точка спрайта (sx,sy) оказалась в точке комнаты (X,Y)
function anchorFor(a, sx, sy, X, Y){ const R=$('#room').getBoundingClientRect(); const k=(a.el?a.el.getBoundingClientRect().width:120)/DogSprite.W;
  return {x: X - (sx-DogSprite.OX)*k/R.width*100, y: Y - (sy-DogSprite.OY)*k/R.height*100}; }
// подойти к миске/поилке: морда ровно в миске, край миски поверх морды
function goBowl(d, f, act, dur, onArrive){
  const a = anim[d.id], b = furnBox(f); if (!a || !b) return false;
  const bb = DogSprite.bbox(d.coat, d.collar||'#f2b84b', act, RIGHT, 0);
  const p = anchorFor(a, bb.x1 - 3, bb.rightY - 1, b.cx, b.top + b.h*0.42);
  goDo(d.id, p.x, p.y, act, dur, RIGHT, onArrive, b.z - 1); return true;
}
// лечь спать на лежанку или ковёр — по центру и поверх
function saveSleepSpot(id){
  const a = anim[id]; if (!a) return; const spot = {x:+a.x.toFixed(2), y:+a.y.toFixed(2), dir:a.dir, zo:a.zo};
  commit(S=>{ const x=S.dogs.find(q=>q.id===id); if (x && x.sleep){ x.sc = x.sc || scene; x.spos = spot; } });
}
function goBed(d){
  const a = anim[d.id], f = furnOf('dsofa') || furnOf('bed') || furnOf('rug'); if (!a || !f) return false;
  const b = furnBox(f); if (!b) return false;
  const face = Math.random() < .5 ? RIGHT : LEFT;
  const bb = DogSprite.bbox(d.coat, d.collar||'#f2b84b', 'sleep', face, 0);
  const p = anchorFor(a, bb.cx, bb.cy + (bb.y1-bb.cy)*0.35, b.cx, f.k==='dsofa' ? b.top + b.h*0.52 : b.cy + b.h*0.05);
  goDo(d.id, p.x, p.y, 'sleep', 0, face, ()=>saveSleepSpot(d.id), b.z + 1); return true;
}
function furnOf(k){ return S.furn.find(f=>f.k===k && (f.sc||'yard')===scene); }
function placeGlows(){
  const G = $('#glows'); if (!G) return; G.innerHTML = '';
  const R = $('#room').getBoundingClientRect();
  document.querySelectorAll('#layer .furn').forEach(el => {
    const f = S.furn.find(x=>x.id===el.dataset.id); const it = f && FURN[f.k]; if (!it || !it.glow) return;
    const r = el.getBoundingClientRect(), gw = it.glow, d = document.createElement('div');
    d.className = 'glow' + (f.k==='neonTube'||f.k==='neonStand' ? ' neon' : '');
    const size = gw.r*FSCALE/100*R.width*2;

    d.style.width = d.style.height = size+'px'; d.style.background = `radial-gradient(circle, ${gw.c} 0%, transparent 68%)`;
    G.appendChild(d);
  });
}
function dogAct(id, act, dur){ const a=anim[id]; if(!a) return; a.tx=null; a.then=null; setAct(a, act, dur); a.wait = dur + rnd(1,3); }
let lastT = performance.now();
const RIGHT = DogSprite.dirFor(1,0), LEFT = DogSprite.dirFor(-1,0);
function loop(t){
  const dt = Math.min(.1,(t-lastT)/1000); lastT=t;
  if (scene==='yard') lawnFrame(t);
  if (S){
    const R = $('#room'); const RW = R.clientWidth, RH = R.clientHeight;
    S.dogs.forEach(d=>{
      const a = anim[d.id]; if(!a||!a.el||d.walk) return;
      if (!editMode){
        if (d.sleep){
          if (a.act!=='sleep' && !a.goingBed){
            a.goingBed = true;
            if (d.spos && d.sc === scene) { a.x=d.spos.x; a.y=d.spos.y; a.dir=d.spos.dir; a.zo=d.spos.zo; a.tx=null; a.then=null; setAct(a,'sleep'); placeDog(d.id); }
            else if (!goBed(d)) { setAct(a,'sleep'); saveSleepSpot(d.id); }
          }
        } else { a.goingBed=false; if (a.act==='sleep') setAct(a,'idle'); }
        // закончилось действие
        if (a.until && t > a.until && a.tx==null){ setAct(a,'idle'); }
        if (a.tx==null && !d.sleep && (a.act==='idle' || a.act==='sit')){
          a.wait-=dt;
          if (a.wait<=0){
            const r = Math.random(), water = furnOf('water');
            if (r < .18 && a.act==='idle'){ setAct(a,'sit',rnd(3,6)); a.wait=rnd(4,7); }
            else if (r < .30 && water){ goBowl(d, water, 'drink', 3); }
            else { a.tx=rnd(12,88); a.ty=rnd(70,96); a.then=null; }
          }
        }
        if (a.tx!=null){
          const dx=a.tx-a.x, dy=a.ty-a.y, dist=Math.hypot(dx,dy), sp=10*dt;
          if (dist<sp){
            a.x=a.tx; a.y=a.ty; a.tx=null; a.wait=rnd(3,8);
            const th=a.then; a.then=null;
            if (th){ if(th.face!=null) a.dir=th.face; setAct(a, th.act, th.dur); if(th.zo!=null){ a.zo=th.zo; placeDog(d.id); } if(th.onArrive) th.onArrive(); if(th.dur) a.wait=th.dur+rnd(2,5); }
            else setAct(a,'idle');
          } else {
            a.x+=dx/dist*sp; a.y+=dy/dist*sp;
            if (a.act!=='walk') setAct(a,'walk');
            a.dir = DogSprite.dirFor(dx*RW, dy*RH);
          }
          placeDog(d.id);
        }
      }
      drawDog(d, a, t);
    });
  }
  requestAnimationFrame(loop);
}
function fx(txt, x, y, n=1){

  for(let i=0;i<n;i++){ const e=document.createElement('div'); e.className='fx'; e.textContent=txt; e.style.left=(x-R.left-10+rnd(-15,15))+'px'; e.style.top=(y-R.top-20)+'px'; e.style.setProperty('--dx', rnd(-30,30)+'px'); e.style.animationDelay=(i*.08)+'s'; $('#room').appendChild(e); setTimeout(()=>e.remove(),1400); }
}

/* ================= walks ================= */
function rollFind(odds){
  const x = Math.random()*100, r = x<odds[0]?0 : x<odds[0]+odds[1]?1:2;
  const pool = FINDS.filter(f=>f.r===r);
  // небольшой приоритет ненайденным
  const fresh = pool.filter(f=>!S.found[f.id]);
  return (fresh.length && Math.random()<.5) ? pick(fresh) : pick(pool);
}
function sendWalk(dogId, rid){
  const d = S.dogs.find(x=>x.id===dogId), r = ROUTES.find(x=>x.id===rid);
  if (!d || d.walk) return;
  if (d.sleep) return toast(`${d.name} спит`);
  if (cur(d).energy < r.en) return toast(`Не хватает сил ⚡ — нужно ${r.en}`);
  commit(S=>{ const x=S.dogs.find(q=>q.id===dogId); norm(x); x.st.energy=clamp(x.st.energy-r.en); x.st.fun=clamp(x.st.fun+20); x.walk={r:rid, until:now()+r.min*60000, by:me.id}; logIt(`отправил(а) ${x.name} гулять: ${r.n}`); });
  if (anim[dogId]) delete anim[dogId];
  closeSheet(); toast(`${d.name} убежал гулять ${r.e}`); sfx.woof();
}
function walkBack(dogId){
  const d = S.dogs.find(x=>x.id===dogId);
  if (!d || !d.walk || d.walk.until>now()) return;
  const r = ROUTES.find(x=>x.id===d.walk.r)||ROUTES[0];
  let f, c, isNew;
  commit(S=>{
    const x=S.dogs.find(q=>q.id===dogId); if(!x||!x.walk) { f=null; return; }
    norm(x); x.walk=null; x.st.clean=clamp(x.st.clean-15);
    f = rollFind(r.odds); c = ri(r.coins[0], r.coins[1]);
    isNew = !S.found[f.id]; S.found[f.id]=(S.found[f.id]||0)+1; S.coins+=c; addXP(x, 8+f.r*6);
    logIt(`${x.name} вернулся с прогулки и принёс «${f.n}»`);
  }, ()=> f ? {text:`🦮 ${d.name} вернулся с прогулки и принёс ${f.e} «${f.n}»`} : null);
  if (!f) return;
  sel = dogId; sfx.win(); haptic('medium'); setTimeout(()=>{ const a=anim[dogId]; if(a){ a.x=10; a.y=88; placeDog(dogId); dogAct(dogId,'happy',2); } },50);
  modal(`<div class="big">${f.e}</div><h3>${f.n}</h3><div class="muted" style="margin-bottom:6px">${RN[f.r]} находка${isNew?' · <b style="color:var(--pink)">новая!</b>':''}</div><p style="font-size:14px;line-height:1.4">${f.t}</p><p>+${c} 🪙</p><button class="btn wide" onclick="closeModal()">В коллекцию</button>`);
  closeSheet(); checkSets();
}
function checkSets(){
  for (let r=0;r<3;r++){
    const all = FINDS.filter(f=>f.r===r).every(f=>S.found[f.id]);
    if (all && !(S.best['set'+r])){ const prize=[200,600,1500][r]; commit(S=>{ if(S.best['set'+r]) return; S.best['set'+r]=1; S.coins+=prize; }); setTimeout(()=>{ toast(`🏆 Собрана вся ${['обычная','редкая','легендарная'][r]} коллекция! +${prize} 🪙`); sfx.win(); }, 1800); }
  }
}
function walkSheet(tab='go'){
  const T = `<div class="tabs"><button data-wt="go" class="${tab==='go'?'on':''}">Прогулки</button><button data-wt="games" class="${tab==='games'?'on':''}">Игры</button><button data-wt="col" class="${tab==='col'?'on':''}">Архив ${Object.keys(S.found).length}/${FINDS.length}</button></div>`;
  if (tab==='games') return T + fairSheet();
  if (tab==='col'){
    return T + `<div class="muted" style="margin-bottom:8px">Собирай всё, что приносят собаки. За полный набор каждой редкости — награда.</div><div class="found">${FINDS.map(f=>`<button class="f r${f.r} ${S.found[f.id]?'':'no'}" data-find="${f.id}">${S.found[f.id]?f.e:'?'}${S.found[f.id]>1?`<small>×${S.found[f.id]}</small>`:''}</button>`).join('')}</div>`;
  }
  const out = S.dogs.filter(d=>d.walk);

  st.set = (act, dir2, dur) => { if (st.act!==act) st.t0=performance.now(); st.act=act; if (dir2!=null) st.dir=dir2; st.until = dur ? performance.now()+dur*1000 : 0; };

  return st;

    ctx.clearRect(0,0,W,H); const sg=ctx.createLinearGradient(0,0,0,H*.7); sg.addColorStop(0,'#3fa4ff'); sg.addColorStop(1,'#d4f0ff'); ctx.fillStyle=sg; ctx.fillRect(0,0,W,H*.7); const gp=grassPal(); ctx.fillStyle=gp.base; ctx.fillRect(0,H*.7,W,H*.3); ctx.fillStyle=gp.mid; for(let gx=0;gx<W;gx+=6){ const hh=6+((gx*7)%9); ctx.fillRect(gx,H*.7-hh+4+Math.sin(t/400+gx*.1)*1.5,3,hh); } ctx.imageSmoothingEnabled=false;

    score+=pts; lastPts=pts; haptic(pts?'medium':'light');
    // мяч летит: идеально — недалеко и ровно, мимо — в кусты за край
    ball = {x:.3, y:.55, tx: pts===3?.78: pts? .9 : 1.15, t0:performance.now()};
    phase='throw'; ph0=performance.now(); dog.set('happy', RIGHT, .35);
  }
  function step(t){
    if(!alive) return;
    pos+=pdir*sp; if(pos>=100||pos<=0){ pdir*=-1; pos=clamp(pos,0,100);} const kk=$('#kk'); if(kk) kk.style.left=`calc(${pos}% - 2px)`;
    const w=cv.clientWidth, h=cv.clientHeight, dpr=window.devicePixelRatio||1; if (cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); ctx.imageSmoothingEnabled=false;
    const sg=ctx.createLinearGradient(0,0,0,h*.62); sg.addColorStop(0,'#3fa4ff'); sg.addColorStop(1,'#d4f0ff'); ctx.fillStyle=sg; ctx.fillRect(0,0,w,h*.62); const gp=grassPal(); ctx.fillStyle=gp.base; ctx.fillRect(0,h*.62,w,h*.38); ctx.fillStyle=gp.mid; for(let gx=0;gx<w;gx+=5){ const hh=5+((gx*7)%8); ctx.fillRect(gx,h*.62-hh+3+Math.sin(t/400+gx*.1)*1.2,2,hh); }
    // кусты справа
    for (let i=0;i<4;i++){ ctx.fillStyle=i%2?'#2f4a2c':'#36552f'; ctx.fillRect(w*.86+i*10, h*.5-i*4, 30, h*.14+i*4); }
    const el = (t-ph0)/1000, k = Math.max(2, Math.floor(h/58));
    if (phase==='throw'){ const bt=Math.min(1, (t-ball.t0)/700); ball.x = .3 + (ball.tx-.3)*bt; ball.y = .55 - Math.sin(bt*Math.PI)*.4; if (bt>=1){ phase='run'; ph0=t; dog.set('walk', RIGHT); } }
    else if (phase==='run'){ dogX += (Math.min(ball.tx,.92)-.08 - dogX)*Math.min(1,(1/60)*5) + .006; if (dogX >= Math.min(ball.tx,.92)-.1){ phase = lastPts? 'grab':'search'; ph0=t; dog.set(lastPts?'eat':'sit', RIGHT); } }
    else if (phase==='grab' && el>.5){ carry=true; ball=null; phase='back'; ph0=t; dog.set('walk', LEFT); }
    else if (phase==='search' && el>1.1){ ball=null; phase='back'; ph0=t; dog.set('walk', LEFT); }
    else if (phase==='back'){ dogX -= .012; if (dogX<=.3){ dogX=.3; phase='done'; ph0=t; carry=false; if (lastPts){ dog.set('happy', FRONT, 1); sfx.win(); toast(lastPts===3?'Идеально! Пёс принёс мяч 🎾 +3':'Почти! +1'); } else { dog.set('shake', FRONT, .8); sfx.bad(); toast('Мимо… мяч улетел в кусты'); } } }
    else if (phase==='done' && el>1.0){ phase='wait'; dog.set('sit', FRONT);
      if (round>=8){ alive=false; const coins=score*5; setTimeout(()=>endGame({coins,key:'fetch',score,better:b=>!b||score>b,title:`Апорт: ${score} очков`}),200); return; }
      setup(); }
    const footY = h*.86, sx = Math.round(dogX*w - DogSprite.OX*k), sy = Math.round(footY - DogSprite.OY*k);
    ctx.drawImage(dog.frame(t), sx, sy, DogSprite.W*k, DogSprite.H*k);
    const bi = pixEmojiImg('🎾');
    if (ball) ctx.drawImage(bi, Math.round(ball.x*w-10), Math.round(ball.y*h-10), 20, 20);
    if (carry){ const right = dog.dir===RIGHT; ctx.drawImage(bi, Math.round(dogX*w + (right?16:-16)*k/2*1.6 - 8), Math.round(footY - 24*k), 16, 16); }
    raf=requestAnimationFrame(step);
  }
  $('#thr').onclick=throwIt;
  setup(); raf=requestAnimationFrame(step);
  gameStop=()=>{ alive=false; cancelAnimationFrame(raf); };
}

async function joinHome(code){
  const mine = JSON.parse(JSON.stringify(S));
  const r = await api('/join', {code}).catch(()=>null);
  if (!r || !r.home) return toast(r && r.error ? r.error : 'Не получилось войти');
  applyHome(r.home);
  // переезд: объединяем
  commit(S=>{
    const ids = new Set(S.dogs.map(d=>d.id));
    mine.dogs.forEach(d=>{ if(!ids.has(d.id) && S.dogs.length<6) S.dogs.push(d); });
    S.coins += mine.coins;
    for (const k in mine.food) S.food[k]=(S.food[k]||0)+mine.food[k];
    for (const k in mine.found) S.found[k]=Math.max(S.found[k]||0, mine.found[k]);
    for (const k in mine.own) S.own[k]=(S.own[k]||0)+mine.own[k];
    mine.furn.forEach(f=>{ S.own[f.k]=(S.own[f.k]||0)+1; });
    Object.assign(S.walls, mine.walls); Object.assign(S.floors, mine.floors);
    logIt('переехал(а) в общий дом 🏡 вместе со своими собаками');
  }, {text:`🏡 ${me.name} переехал(а) к тебе в дом!`});

  modal(`<div class="big">🏡💞</div><h3>Вы теперь живёте вместе!</h3><p class="muted">Собаки, монеты и находки объединены. Твоя мебель лежит на складе — расставь её через ✏️.</p><button class="btn wide" onclick="closeModal()">Ура!</button>`);
}

const EMO_RE = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*/gu;
const EMO_T = /\p{Extended_Pictographic}/u;
const emoCache = {}, emoImgCache = {};
function pixEmoji(e){
  if (emoCache[e]) return emoCache[e];
  const N = 40, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d');
  x.font = '30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(e, N/2, N/2+2);
  const d = x.getImageData(0,0,N,N), D = d.data, A = new Uint8Array(N*N);
  for (let i=0;i<N*N;i++){
    if (D[i*4+3] < 120) { D[i*4+3]=0; continue; }
    A[i]=1; let r=D[i*4], g=D[i*4+1], b=D[i*4+2]; const l=(r+g+b)/3;
    r = l + (r-l)*1.35; g = l + (g-l)*1.35; b = l + (b-l)*1.35;           // ярче цвета
    const q = v => Math.max(0, Math.min(255, Math.round(v/40)*40 + 12));     // плоская заливка
    D[i*4]=q(r); D[i*4+1]=q(g); D[i*4+2]=q(b); D[i*4+3]=255;
  }
  for (let pass=0; pass<2; pass++){ const B=A.slice();
    for (let y=0;y<N;y++) for (let xx=0;xx<N;xx++){ const i=y*N+xx; if (B[i]) continue;
      if ((xx>0&&B[i-1])||(xx<N-1&&B[i+1])||(y>0&&B[i-N])||(y<N-1&&B[i+N])) { D[i*4]=16;D[i*4+1]=19;D[i*4+2]=28;D[i*4+3]=255; A[i]=1; } } }
  x.putImageData(d,0,0);
  return (emoCache[e] = c.toDataURL());
}

function pixify(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    if (!EMO_T.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;

    return NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while (w.nextNode()) list.push(w.currentNode);
  for (const n of list){
    const s = n.nodeValue, frag = document.createDocumentFragment(); let last = 0;
    for (const m of s.matchAll(EMO_RE)){ if (m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index))); const im=document.createElement('img'); im.className='pe'; im.alt=m[0]; im.src=pixEmoji(m[0]); frag.appendChild(im); last=m.index+m[0].length; }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));

const furnCache = {};
function furnHTML(k){
  if (furnCache[k] && furnCache[k] !== 'loading') return `<img class="fi" src="${furnCache[k]}" alt="">`;
  if (!furnCache[k]) {
    furnCache[k] = 'loading';
    const it = FURN[k], svg = it.svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    const vb = (svg.match(/viewBox="([^"]+)"/)||[])[1].split(/\s+/).map(Number);
    const im = new Image();
    im.onload = () => {
      // пиксельная версия: суперсэмплинг → квантование → свет/тень по силуэту → цветной контур
      const pw = Math.max(12, Math.round(it.w * FSCALE * 2.3)), ph = Math.max(8, Math.round(pw * vb[3] / vb[2]));
      const SS = 4, big = document.createElement('canvas'); big.width = pw*SS; big.height = ph*SS; big.getContext('2d').drawImage(im, 0, 0, pw*SS, ph*SS);
      const W2 = pw + 2, H2 = ph + 2;
      const c = document.createElement('canvas'); c.width = W2; c.height = H2; const x = c.getContext('2d');
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(big, 1, 1, pw, ph);
      const d = x.getImageData(0,0,W2,H2), D = d.data, A = new Uint8Array(W2*H2);
      for (let i=0;i<W2*H2;i++){ const a=D[i*4+3]; if (a<110){ D[i*4+3]=0; continue; } A[i]=1;
        for (let q=0;q<3;q++){ D[i*4+q] = Math.min(255, Math.round(D[i*4+q]/12)*12); } D[i*4+3]=255; }
      const O = new Uint8ClampedArray(D);
      for (let y=0;y<H2;y++) for (let xx=0;xx<W2;xx++){ const i=y*W2+xx;
        if (A[i]) {
          const up = y>0 && A[i-W2], dn = y<H2-1 && A[i+W2], lf = xx>0 && A[i-1];
          let f = 1; if (!up) f = 1.18; else if (!lf) f = 1.08; if (!dn) f = 0.78;
          if (f !== 1) for (let q=0;q<3;q++) O[i*4+q] = Math.min(255, D[i*4+q]*f);
        } else {
          let n = -1; if (xx>0&&A[i-1]) n=i-1; else if (xx<W2-1&&A[i+1]) n=i+1; else if (y>0&&A[i-W2]) n=i-W2; else if (y<H2-1&&A[i+W2]) n=i+W2;

        } }

    };

  }

}

  for (const b of arr){
    const persp = front ? 1 : b.y / H;
    const gust = Math.sin(t*1.1 - b.x*0.045) * 0.6 + Math.sin(t*2.3 + b.ph) * 0.25;
    const lean = gust * wind * (0.3 + 0.7*persp) * b.h * 0.45;
    const x0 = b.x, y0 = b.y, tx = x0 + lean, ty = y0 - b.h;
    ctx.fillStyle = b.c < .45 ? pal.base : pal.mid;
    ctx.beginPath(); ctx.moveTo(x0 - b.w/2, y0); ctx.lineTo(x0 + b.w/2, y0); ctx.lineTo(tx, ty); ctx.closePath(); ctx.fill();
    // кончик светлее
    if (!front && persp < 0.3 && !b.hl) continue;
    const mx = x0 + lean*0.55, my = y0 - b.h*0.55, hw = b.w*0.25;
    ctx.fillStyle = b.hl ? pal.hl : pal.tip;
    ctx.beginPath(); ctx.moveTo(mx - hw, my); ctx.lineTo(mx + hw, my); ctx.lineTo(tx, ty); ctx.closePath(); ctx.fill();
  }
}
function lawnFrame(t){
  if (!Lawn.W) lawnInit();
  if (!Lawn.W || t - Lawn.last < 33) return; Lawn.last = t; t /= 1000;
  const pal = grassPal(), night = skyNow().dark;
  const g = $('#grass').getContext('2d'), W = Lawn.W, H = Lawn.H;
  const gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0, pal.soil); gr.addColorStop(1, pal.base);
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  drawBlades(g, Lawn.blades, H, t, pal, night, false);
  const f = $('#grassF').getContext('2d'); f.clearRect(0,0,W,Lawn.FH);
  drawBlades(f, Lawn.front, Lawn.FH, t, pal, night, true);
  if (night) for (const fl of Lawn.flies){ fl.x += Math.sin(t*0.7 + fl.p)*0.25; fl.y += Math.cos(t*0.9 + fl.p)*0.15; const a = (Math.sin(t*2 + fl.p)+1)/2;
    f.fillStyle = `rgba(220,255,120,${0.35 + a*0.6})`; f.fillRect(Math.round((fl.x%W+W)%W), Math.round(((fl.y%Lawn.FH)+Lawn.FH)%Lawn.FH), 1, 1); }
}
window.addEventListener('resize', ()=>{ Lawn.W = 0; drawRoomBg(); });
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));
$('#giftI').innerHTML = ic('gift');
(function(){ const order=['den','kitchen','yard'];
  $('#scPrev').innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
  $('#scNext').innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
  const go = d => { if (editMode) return; const i = order.indexOf(scene) + d; if (i<0 || i>=order.length) return; haptic(); setScene(order[i]); };
  $('#scPrev').onclick = () => go(-1); $('#scNext').onclick = () => go(1); })();
(function(){ const D=$('#dust'); for(let i=0;i<16;i++){ const m=document.createElement('i'); m.style.left=rnd(5,60)+'%'; m.style.top=rnd(30,95)+'%'; m.style.setProperty('--mx',rnd(-20,30)+'px'); m.style.animationDuration=rnd(7,14)+'s'; m.style.animationDelay=(-rnd(0,14))+'s'; D.appendChild(m);} })(); $('#pairI').innerHTML = ic('hearts');
async function boot(){
  requestAnimationFrame(loop);
  let r=null;
  if (location.protocol.startsWith('http')) r = await api('/me').catch(()=>null);
  if (r && r.ok){
    online = true; botInfo = r.bot||{}; me = {id:String(r.user.id), name:r.user.name, photo:r.user.photo||'', fcode:r.user.fcode||''};
    if (r.home){ applyHome(r.home); }
    else {
      // если локально уже была игра — переносим на сервер
      try{ const loc = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(loc && loc.dogs && loc.dogs.length){ const c=await api('/home/create',{state:loc}); if(c.home) applyHome(c.home); } }catch(e){}
    }
    setInterval(poll, 5000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
  } else {
    try{ const loc = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(loc) S = migrate(loc); }catch(e){}
  }
  if (!S || !S.dogs.length){ adoptFlow(false); return; }
  setScene('den'); markUnseen();
  if (online) startSocial();
  if (joinParam && online) askJoin(joinParam);
}
setInterval(()=>{ if(S && !editMode){ renderPanel(); renderTop(); } }, 15000);
let skyKey = ''; setInterval(()=>{ if(!S) return; paintRoom(); const k = skyNow().key; if (k !== skyKey){ skyKey = k; drawRoomBg(); render(); } }, 30000);
boot();
</script>
